# Render Blueprint: New > Blueprint > pick this repo.
# Creates Postgres and the API. The frontend is hosted on Vercel; set
# VITE_API_URL there to this API's URL. Set LLM_API_KEY afterwards to
# enable the AI model (otherwise the offline companion is used).
databases:
  - name: lantern-db
    plan: free
    databaseName: lantern
    user: lantern

services:
  - type: web
    name: lantern-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lantern-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://lantern.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://lantern[a-z0-9-]*\.vercel\.app$
